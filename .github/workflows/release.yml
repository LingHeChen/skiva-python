name: Publish Python SDK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/python.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              project = tomllib.load(f)['project']
          assert project['name'] == 'skiva-sdk'
          assert os.environ['GITHUB_REF_NAME'] == 'v' + project['version'], 'Tag must match package version'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/skiva-wheel
          /tmp/skiva-wheel/bin/python -m pip install dist/*.whl
          /tmp/skiva-wheel/bin/python -c "import os; from importlib.metadata import version; from skiva_sdk import SkivaClient; assert 'v' + version('skiva-sdk') == os.environ['GITHUB_REF_NAME']"
          /tmp/skiva-wheel/bin/python examples/offline_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/skiva-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
