name: Python SDK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev,pydantic-ai]'
      - run: ruff check src tests examples
      - run: pytest -q --cov=skiva_sdk --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:.test-results/coverage.xml --junitxml=.test-results/junit.xml
      - run: python -m build
      - run: python examples/offline_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-test-results
          path: .test-results/
          include-hidden-files: true
