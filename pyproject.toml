[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "skiva-sdk"
version = "0.1.0"
description = "Version-aware Skill discovery and delivery for Skiva"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.urls]
Documentation = "https://linghechen.github.io/skiva/docs/sdk-python/"
Repository = "https://github.com/LingHeChen/skiva-python"
Issues = "https://github.com/LingHeChen/skiva-python/issues"
Changelog = "https://github.com/LingHeChen/skiva-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim==2.59.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "hypothesis>=6", "build>=1.2", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/skiva_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["/.test-results", "/.hypothesis", "/.coverage*", "/.venv", "/dist", "/.pytest_cache", "/.ruff_cache", "**/__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["skiva_sdk"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
